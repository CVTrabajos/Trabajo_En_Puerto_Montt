name: Actualizar Ofertas Automaticamente
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Descargar ofertas desde Google Apps Script
        run: |
          curl -L -s -o ofertas.json "https://script.google.com/macros/s/AKfycbwZF9Ih52LwBeo4Y3SEbnvEhBzKKDjZWi_Um_ulJ1OZaZhEV8gIJW4J7UMTopNjbqma/exec"
          if [ ! -s ofertas.json ]; then
            echo "[]" > ofertas.json
          fi
      - name: Confirmar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualizar ofertas vigentes [skip ci]" && git push)
