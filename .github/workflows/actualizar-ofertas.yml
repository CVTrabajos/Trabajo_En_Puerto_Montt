name: Actualizar Ofertas Automaticamente

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Descargar ofertas desde Apps Script
        run: |
          curl -L -s "https://script.google.com/macros/s/AKfycbzm3KlsBRcbeZLxZRS2Hw4-vawjBynVudVuitqlea4fcvtzKzNcjWBWh_HOb7J7G0u1cg/exec" -o ofertas.json

      - name: Commit y push si hay cambios
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add ofertas.json
          git commit -m "Auto-actualizar ofertas.json [skip ci]" || exit 0
          git push
